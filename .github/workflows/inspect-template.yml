name: inspect-template

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-template:
    name: Inspect configured WeChat template (read only)
    if: >
      github.repository == 'carloshuangspec/wechat-ldr-daily-push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'carloshuangspec' &&
      github.triggering_actor == 'carloshuangspec' &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests without live credentials
        run: python -m unittest discover -s tests -q
      - name: Check template fields without sending
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
        run: python src/inspect_template.py
