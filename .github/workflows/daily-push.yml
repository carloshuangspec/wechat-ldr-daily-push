# 阶段 C：CN 定时真发默认关闭；手动测试与预览保持独立。
name: daily-push

"on":
  schedule:
    - cron: "7 8 * * *"
      timezone: "Asia/Shanghai"
    - cron: "13 8 * * *"
      timezone: "America/Detroit"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview（仅预览）/ live-self（US 自测）/ live-cn（CN 测试）"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - live-self
          - live-cn
      slot:
        description: "预览槽位；live-self 只允许 us，live-cn 只允许 cn"
        required: true
        default: cn
        type: choice
        options:
          - cn
          - us
          - both
      confirmation:
        description: "live-self: SEND_SELF_ONCE；live-cn: SEND_CN_ONCE"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: wechat-ldr-daily-push-stage-c
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: Validate stage-C gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail-closed validation
        shell: bash
        env:
          REQUEST_EVENT: ${{ github.event_name }}
          REQUEST_MODE: ${{ inputs.mode }}
          REQUEST_SLOT: ${{ inputs.slot }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_REPOSITORY: ${{ github.repository }}
          REQUEST_REF: ${{ github.ref }}
          REQUEST_ACTOR: ${{ github.actor }}
          REQUEST_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REQUEST_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          case "$REQUEST_EVENT" in
            schedule)
              exit 0
              ;;
            workflow_dispatch)
              ;;
            *)
              echo "::error::Unsupported workflow event."
              exit 1
              ;;
          esac

          case "$REQUEST_SLOT" in
            cn|us|both)
              ;;
            *)
              echo "::error::Invalid slot."
              exit 1
              ;;
          esac

          case "$REQUEST_MODE" in
            preview)
              ;;
            live-self)
              if [ "$REQUEST_SLOT" != "us" ] || [ "$REQUEST_CONFIRMATION" != "SEND_SELF_ONCE" ]; then
                echo "::error::live-self requires slot=us and the exact confirmation."
                exit 1
              fi
              if [ "$REQUEST_REPOSITORY" != "carloshuangspec/wechat-ldr-daily-push" ] || [ "$REQUEST_REF" != "refs/heads/main" ]; then
                echo "::error::live-self is restricted to the canonical repository main branch."
                exit 1
              fi
              if [ "$REQUEST_ACTOR" != "carloshuangspec" ] || [ "$REQUEST_TRIGGERING_ACTOR" != "carloshuangspec" ]; then
                echo "::error::live-self is restricted to the repository owner."
                exit 1
              fi
              if [ "$REQUEST_ATTEMPT" != "1" ]; then
                echo "::error::Re-running a live-self workflow is not allowed."
                exit 1
              fi
              ;;
            live-cn)
              if [ "$REQUEST_SLOT" != "cn" ] || [ "$REQUEST_CONFIRMATION" != "SEND_CN_ONCE" ]; then
                echo "::error::live-cn requires slot=cn and the exact confirmation."
                exit 1
              fi
              if [ "$REQUEST_REPOSITORY" != "carloshuangspec/wechat-ldr-daily-push" ] || [ "$REQUEST_REF" != "refs/heads/main" ]; then
                echo "::error::live-cn is restricted to the canonical repository main branch."
                exit 1
              fi
              if [ "$REQUEST_ACTOR" != "carloshuangspec" ] || [ "$REQUEST_TRIGGERING_ACTOR" != "carloshuangspec" ]; then
                echo "::error::live-cn is restricted to the repository owner."
                exit 1
              fi
              if [ "$REQUEST_ATTEMPT" != "1" ]; then
                echo "::error::Re-running a live-cn workflow is not allowed."
                exit 1
              fi
              ;;
            *)
              echo "::error::Invalid mode."
              exit 1
              ;;
          esac

  preview-cn:
    name: Preview CN (Asia/Shanghai ~08:07)
    needs: validate-dispatch
    if: >
      needs.validate-dispatch.result == 'success' &&
      ((github.event_name == 'schedule' && github.event.schedule == '7 8 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' &&
        (inputs.slot == 'cn' || inputs.slot == 'both')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Preview CN
        env:
          PUSH_SLOT: cn
          SEND_MODE: dry-run
          CITY_A: ${{ vars.CITY_A }}
          CITY_B: ${{ vars.CITY_B }}
          CITY_A_TZ: ${{ vars.CITY_A_TZ }}
          CITY_B_TZ: ${{ vars.CITY_B_TZ }}
          KNOWN_START_DATE: ${{ vars.KNOWN_START_DATE }}
          LOVE_START_DATE: ${{ secrets.LOVE_START_DATE }}
          NEXT_MEET_DATE: ${{ secrets.NEXT_MEET_DATE }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # 预览 job 故意不加载任何 WECHAT_*。
        run: |
          export CITY_A="${CITY_A:-Ann Arbor}"
          export CITY_B="${CITY_B:-Shanghai}"
          export CITY_A_TZ="${CITY_A_TZ:-America/Detroit}"
          export CITY_B_TZ="${CITY_B_TZ:-Asia/Shanghai}"
          python src/main.py

  preview-us:
    name: Preview US (America/Detroit ~08:13)
    needs: validate-dispatch
    if: >
      needs.validate-dispatch.result == 'success' &&
      ((github.event_name == 'schedule' && github.event.schedule == '13 8 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' &&
        (inputs.slot == 'us' || inputs.slot == 'both')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Preview US
        env:
          PUSH_SLOT: us
          SEND_MODE: dry-run
          CITY_A: ${{ vars.CITY_A }}
          CITY_B: ${{ vars.CITY_B }}
          CITY_A_TZ: ${{ vars.CITY_A_TZ }}
          CITY_B_TZ: ${{ vars.CITY_B_TZ }}
          KNOWN_START_DATE: ${{ vars.KNOWN_START_DATE }}
          LOVE_START_DATE: ${{ secrets.LOVE_START_DATE }}
          NEXT_MEET_DATE: ${{ secrets.NEXT_MEET_DATE }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # 预览 job 故意不加载任何 WECHAT_*。
        run: |
          export CITY_A="${CITY_A:-Ann Arbor}"
          export CITY_B="${CITY_B:-Shanghai}"
          export CITY_A_TZ="${CITY_A_TZ:-America/Detroit}"
          export CITY_B_TZ="${CITY_B_TZ:-Asia/Shanghai}"
          python src/main.py

  live-self:
    name: LIVE SELF (one controlled attempt)
    needs: validate-dispatch
    if: >
      needs.validate-dispatch.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'live-self' && inputs.slot == 'us' &&
      inputs.confirmation == 'SEND_SELF_ONCE' &&
      github.repository == 'carloshuangspec/wechat-ldr-daily-push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'carloshuangspec' &&
      github.triggering_actor == 'carloshuangspec' &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests without live credentials
        run: python -m unittest discover -s tests -v
      - name: Send SELF once
        env:
          PUSH_SLOT: us
          SEND_MODE: live
          LIVE_RECIPIENT: self
          LIVE_CONFIRMATION: ${{ inputs.confirmation }}
          CITY_A: ${{ vars.CITY_A }}
          CITY_B: ${{ vars.CITY_B }}
          CITY_A_TZ: ${{ vars.CITY_A_TZ }}
          CITY_B_TZ: ${{ vars.CITY_B_TZ }}
          KNOWN_START_DATE: ${{ vars.KNOWN_START_DATE }}
          LOVE_START_DATE: ${{ secrets.LOVE_START_DATE }}
          NEXT_MEET_DATE: ${{ secrets.NEXT_MEET_DATE }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          WECHAT_OPENID_SELF: ${{ secrets.WECHAT_OPENID_SELF }}
        run: |
          export CITY_A="${CITY_A:-Ann Arbor}"
          export CITY_B="${CITY_B:-Shanghai}"
          export CITY_A_TZ="${CITY_A_TZ:-America/Detroit}"
          export CITY_B_TZ="${CITY_B_TZ:-Asia/Shanghai}"
          python src/main.py

  live-cn:
    name: LIVE CN (one controlled attempt)
    needs: validate-dispatch
    if: >
      needs.validate-dispatch.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'live-cn' && inputs.slot == 'cn' &&
      inputs.confirmation == 'SEND_CN_ONCE' &&
      github.repository == 'carloshuangspec/wechat-ldr-daily-push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'carloshuangspec' &&
      github.triggering_actor == 'carloshuangspec' &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests without live credentials
        run: python -m unittest discover -s tests -v
      - name: Send CN once
        env:
          PUSH_SLOT: cn
          SEND_MODE: live
          LIVE_RECIPIENT: cn
          LIVE_CONFIRMATION: ${{ inputs.confirmation }}
          CITY_A: ${{ vars.CITY_A }}
          CITY_B: ${{ vars.CITY_B }}
          CITY_A_TZ: ${{ vars.CITY_A_TZ }}
          CITY_B_TZ: ${{ vars.CITY_B_TZ }}
          KNOWN_START_DATE: ${{ vars.KNOWN_START_DATE }}
          LOVE_START_DATE: ${{ secrets.LOVE_START_DATE }}
          NEXT_MEET_DATE: ${{ secrets.NEXT_MEET_DATE }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          WECHAT_OPENID_CN: ${{ secrets.WECHAT_OPENID_CN }}
        run: |
          export CITY_A="${CITY_A:-Ann Arbor}"
          export CITY_B="${CITY_B:-Shanghai}"
          export CITY_A_TZ="${CITY_A_TZ:-America/Detroit}"
          export CITY_B_TZ="${CITY_B_TZ:-Asia/Shanghai}"
          python src/main.py

  scheduled-cn:
    name: LIVE CN schedule (disabled unless explicitly enabled)
    needs: validate-dispatch
    if: >
      needs.validate-dispatch.result == 'success' &&
      github.event_name == 'schedule' &&
      github.event.schedule == '7 8 * * *' &&
      vars.ENABLE_CN_DAILY == '1' &&
      github.repository == 'carloshuangspec/wechat-ldr-daily-push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests without live credentials
        run: python -m unittest discover -s tests -v
      - name: Send scheduled CN
        env:
          PUSH_SLOT: cn
          SEND_MODE: live
          LIVE_RECIPIENT: cn
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ENABLE_CN_DAILY: ${{ vars.ENABLE_CN_DAILY }}
          CITY_A: ${{ vars.CITY_A }}
          CITY_B: ${{ vars.CITY_B }}
          CITY_A_TZ: ${{ vars.CITY_A_TZ }}
          CITY_B_TZ: ${{ vars.CITY_B_TZ }}
          KNOWN_START_DATE: ${{ vars.KNOWN_START_DATE }}
          LOVE_START_DATE: ${{ secrets.LOVE_START_DATE }}
          NEXT_MEET_DATE: ${{ secrets.NEXT_MEET_DATE }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          WECHAT_OPENID_CN: ${{ secrets.WECHAT_OPENID_CN }}
        run: |
          export CITY_A="${CITY_A:-Ann Arbor}"
          export CITY_B="${CITY_B:-Shanghai}"
          export CITY_A_TZ="${CITY_A_TZ:-America/Detroit}"
          export CITY_B_TZ="${CITY_B_TZ:-Asia/Shanghai}"
          python src/main.py
