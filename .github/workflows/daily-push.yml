# 双时区早安推送
# - 中国 08:00 Asia/Shanghai = UTC 00:00
# - 美国东部约 08:00 America/New_York：
#     冬令时 EST (UTC-5) → UTC 13:00
#     夏令时 EDT (UTC-4) → UTC 12:00
#   GitHub cron 固定 UTC，无法自动跟 DST；默认按冬令时 13:00 UTC，
#   夏令时期间会变成当地 09:00，可按需改 cron。

name: daily-push

on:
  schedule:
    # 中国 08:00（全年 UTC 00:00）
    - cron: "0 0 * * *"
    # 美国东部约 08:00（冬令时 UTC 13:00）
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "推送槽位 cn / us / both"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - cn
          - us

jobs:
  push-cn:
    name: push-cn (Asia/Shanghai ~08:00)
    if: >
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.slot == 'cn' || github.event.inputs.slot == 'both')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Push CN slot
        env:
          PUSH_SLOT: cn
          CITY_A: ${{ vars.CITY_A }}
          CITY_B: ${{ vars.CITY_B }}
          CITY_A_TZ: ${{ vars.CITY_A_TZ }}
          CITY_B_TZ: ${{ vars.CITY_B_TZ }}
          LOVE_START_DATE: ${{ secrets.LOVE_START_DATE }}
          NEXT_MEET_DATE: ${{ secrets.NEXT_MEET_DATE }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          WECHAT_OPENID_CN: ${{ secrets.WECHAT_OPENID_CN }}
          WECHAT_OPENID_US: ${{ secrets.WECHAT_OPENID_US }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: |
          export CITY_A="${CITY_A:-Ann Arbor}"
          export CITY_B="${CITY_B:-Shanghai}"
          export CITY_A_TZ="${CITY_A_TZ:-America/Detroit}"
          export CITY_B_TZ="${CITY_B_TZ:-Asia/Shanghai}"
          export DRY_RUN="${DRY_RUN:-0}"
          python src/main.py

  push-us:
    name: push-us (America/New_York ~08:00)
    if: >
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.slot == 'us' || github.event.inputs.slot == 'both')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Push US slot
        env:
          PUSH_SLOT: us
          CITY_A: ${{ vars.CITY_A }}
          CITY_B: ${{ vars.CITY_B }}
          CITY_A_TZ: ${{ vars.CITY_A_TZ }}
          CITY_B_TZ: ${{ vars.CITY_B_TZ }}
          LOVE_START_DATE: ${{ secrets.LOVE_START_DATE }}
          NEXT_MEET_DATE: ${{ secrets.NEXT_MEET_DATE }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          WECHAT_OPENID_CN: ${{ secrets.WECHAT_OPENID_CN }}
          WECHAT_OPENID_US: ${{ secrets.WECHAT_OPENID_US }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: |
          export CITY_A="${CITY_A:-Ann Arbor}"
          export CITY_B="${CITY_B:-Shanghai}"
          export CITY_A_TZ="${CITY_A_TZ:-America/Detroit}"
          export CITY_B_TZ="${CITY_B_TZ:-Asia/Shanghai}"
          export DRY_RUN="${DRY_RUN:-0}"
          python src/main.py
